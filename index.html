<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KartenWert">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>KartenWert</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>
  <nav id="nav">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.5l9 8h-2.500V20h-4.500v-5.500h-4V20H5.500v-8.500H3z"/></svg>Start</button>
    <button data-tab="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l4.500 4.500"/></svg>Suche</button>
    <button data-tab="market"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h2.600l.700 2.500H21l-2.300 8H8.300L5.300 6.200 4.700 6H3zM9 16.500a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm8.500 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>Markt</button>
    <button data-tab="portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="6" width="11" height="15" rx="2" transform="rotate(-8 9 13)"/><path d="M15 4.500l4.500 1.200-3 13"/></svg>Portfolio</button>
    <button data-tab="profile"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.500"/><path d="M3.500 21c.6-5 4-7.500 8.500-7.500s7.900 2.500 8.500 7.500z"/></svg>Profil</button>
  </nav>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
